[package]
name = "devdust-core"
description = "Finds regenerable dependency and build directories in cold projects"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytesize = "2.7.0"
dashmap = "6.2.1"
globset = "0.4.20"
humantime = "2.4.0"
jwalk = "0.9.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
trash = "5.2.9"
walkdir = "2.5.0"

[dev-dependencies]
devdust-fixtures = { path = "../../tests/fixtures" }
proptest = "1.12.0"
