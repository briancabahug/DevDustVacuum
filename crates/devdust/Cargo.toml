[package]
name = "devdust"
description = "Reclaims disk space from dependency and build directories in cold projects"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bytesize = "2.7.0"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", default-features = false }
comfy-table = "8.0.1"
devdust-core = { path = "../devdust-core" }
dialoguer = { version = "0.12.0", default-features = false }
humantime = "2.4.0"
indicatif = "0.18.6"
serde_json = "1.0.154"

[dev-dependencies]
devdust-fixtures = { path = "../../tests/fixtures" }
serde_json = "1.0.154"
